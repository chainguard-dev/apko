name: Release

# Releases are cut from version tags pushed by mono's publish. A tag push runs
# this workflow from the tagged commit, so the dispatch job re-runs it on main:
# release artifacts must be signed as release.yaml@refs/heads/main. To build a
# tag by hand, run this workflow on main with that tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag on main that has no release yet'
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    name: Dispatch release on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Run the release workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ inputs.tag }}
      cancel-in-progress: false

    # https://docs.github.com/en/actions/reference/authentication-in-a-workflow
    permissions:
      id-token: write
      contents: write

    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            github.com:443
            go.dev:443
            goreleaser.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Check the workflow runs on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main: release artifacts must be signed as release.yaml@refs/heads/main."
          exit 1

      - name: Check the tag is a version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not a vX.Y.Z version."
            exit 1
          fi

      # Releases are immutable, so goreleaser must create the release itself.
      # The list includes drafts, which goreleaser cannot see by tag.
      - name: Check the tag has no release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$ids" ]; then
            echo "A release for $TAG already exists. If it is a draft left by a failed run, delete it and run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG points at a commit that is not on main."
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: './.go-version'
          check-latest: true
          # Disable caching to avoid cache poisoning of release artifacts.
          cache: false

      # Cosign is used by goreleaser to sign release artifacts.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # https://github.com/goreleaser/goreleaser/issues/6195
          cosign-release: "v2.6.1"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          install-only: true

      - name: Release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          GIT_VERSION: ${{ env.TAG }}
