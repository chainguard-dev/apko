name: Go Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            alpinelinux.org:443
            api.github.com:443
            apk.cgr.dev:443
            dl-cdn.alpinelinux.org:443
            dl.google.com:443
            files.example.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Test
        run: |
          # The tests golden fixtures all expect `SOURCE_DATE_EPOCH` to be `0`.
          # They set this themselves. This environment variable is a guard to
          # ensure that if the test environment happens to have
          # `SOURCE_DATE_EPOCH` set, it does not end up being used. The `awk`
          # program returns a random integer between `1` and now.
          SOURCE_DATE_EPOCH=$(
            awk 'BEGIN {
              now = systime()
              srand(now)

              print 1 + int(rand() * now)
            }'
          )

          export SOURCE_DATE_EPOCH

          make test
